<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌤️ Weather Project - Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .file-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        select {
            padding: 12px;
            font-size: 1em;
            border: 2px solid #667eea;
            border-radius: 8px;
            background-color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:hover {
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-analyze {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-analyze:active {
            transform: translateY(0);
        }

        .btn-reset {
            background: #e0e0e0;
            color: #333;
        }

        .btn-reset:hover {
            background: #d0d0d0;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 600;
            margin: 20px 0;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background-color: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #c62828;
        }

        .success {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #2e7d32;
        }

        .file-meta {
            text-align: center;
            margin: 10px 0 20px;
            color: #555;
        }

        .btn-delete {
            background: #e53935;
            color: white;
        }

        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(229, 57, 53, 0.4);
        }

        .results {
            display: none;
        }

        .summary-section {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .summary-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .summary-text {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
            color: #333;
        }

        .file-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box .number {
            font-size: 2.5em;
            font-weight: bold;
        }

        .stat-box .label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .file-selector,
            .button-group,
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Weather Project</h1>
            <p>Analyze weather data from CSV files</p>
        </div>

        <div class="card">
            <div class="file-selector">
                <div>
                    <label for="fileSelect" style="display: block; margin-bottom: 8px; font-weight: 600;">Select a file:</label>
                    <select id="fileSelect">
                        <option value="">-- Choose a file --</option>
                        {% for file in files %}
                        <option value="{{ file }}">{{ file }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="fileUpload" style="display: block; margin-bottom: 8px; font-weight: 600;">Upload a new CSV file:</label>
                    <input type="file" id="fileUpload" accept=".csv" style="width: 100%; padding: 12px; border: 2px solid #667eea; border-radius: 8px;" />
                </div>
            </div>

            <div class="button-group">
                <button class="btn-analyze" onclick="analyzeData()">📊 Analyze</button>
                <button class="btn-analyze" onclick="uploadData()">⬆️ Upload</button>
                <button class="btn-reset" onclick="resetResults()">🔄 Reset</button>
            </div>

            <div class="loading" id="loading">
                <span class="spinner"></span>
                <span>Processing data...</span>
            </div>

            <div class="error" id="error"></div>
            <div class="success" id="success"></div>

            <div class="results" id="results">
                <div class="file-info" id="fileInfo"></div>
                <div class="file-meta" id="fileMeta"></div>
                <div class="file-controls" id="fileControls" style="display:none; text-align:center; margin-bottom:20px;">
                    <button class="btn-delete" onclick="deleteData()">🗑️ Delete Uploaded File</button>
                </div>
                <div class="stats" id="stats"></div>

                <div class="summary-section">
                    <h3>📈 General Summary</h3>
                    <div class="summary-text" id="summaryText"></div>
                </div>

                <div class="summary-section">
                    <h3>📅 Daily Summary</h3>
                    <div class="summary-text" id="dailySummaryText"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function analyzeData() {
            const fileSelect = document.getElementById('fileSelect');
            const filename = fileSelect.value;

            if (!filename) {
                showError('Please select a file');
                return;
            }

            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const success = document.getElementById('success');
            const results = document.getElementById('results');

            loading.style.display = 'block';
            error.style.display = 'none';
            success.style.display = 'none';
            results.style.display = 'none';

            fetch('/api/analyze', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ filename: filename })
            })
            .then(response => response.json())
            .then(data => {
                loading.style.display = 'none';

                if (data.error) {
                    showError(data.error);
                    return;
                }

                displayResults(data);
            })
            .catch(err => {
                loading.style.display = 'none';
                showError('Error: ' + err.message);
            });
        }

        function displayResults(data) {
            const results = document.getElementById('results');
            const fileInfo = document.getElementById('fileInfo');
            const fileMeta = document.getElementById('fileMeta');
            const fileControls = document.getElementById('fileControls');
            const summaryText = document.getElementById('summaryText');
            const dailySummaryText = document.getElementById('dailySummaryText');
            const stats = document.getElementById('stats');

            fileInfo.textContent = `📂 File: ${data.filename} | Days: ${data.days}`;
            fileMeta.textContent = data.source === 'uploaded'
                ? `Source: Uploaded | Uploaded at: ${data.upload_date}`
                : 'Source: Sample data';
            summaryText.textContent = data.summary;
            dailySummaryText.textContent = data.daily_summary;

            stats.innerHTML = `
                <div class="stat-box">
                    <div class="number">${data.days}</div>
                    <div class="label">Days of Data</div>
                </div>
                <div class="stat-box">
                    <div class="number">📊</div>
                    <div class="label">Analysis Complete</div>
                </div>
            `;

            if (data.source === 'uploaded') {
                fileControls.style.display = 'block';
            } else {
                fileControls.style.display = 'none';
            }

            results.style.display = 'block';
            results.scrollIntoView({ behavior: 'smooth' });
        }

        function showError(message) {
            const error = document.getElementById('error');
            const success = document.getElementById('success');
            success.style.display = 'none';
            error.textContent = '❌ ' + message;
            error.style.display = 'block';
        }

        function showSuccess(message) {
            const success = document.getElementById('success');
            const error = document.getElementById('error');
            error.style.display = 'none';
            success.textContent = '✅ ' + message;
            success.style.display = 'block';
        }

        function updateFileSelect(files, selected) {
            const fileSelect = document.getElementById('fileSelect');
            fileSelect.innerHTML = '<option value="">-- Choose a file --</option>';
            files.forEach(file => {
                const option = document.createElement('option');
                option.value = file;
                option.textContent = file;
                if (file === selected) {
                    option.selected = true;
                }
                fileSelect.appendChild(option);
            });
        }

        function uploadData() {
            const fileInput = document.getElementById('fileUpload');
            const file = fileInput.files[0];
            const success = document.getElementById('success');

            if (!file) {
                showError('Please choose a CSV file to upload.');
                return;
            }

            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const results = document.getElementById('results');

            loading.style.display = 'block';
            error.style.display = 'none';
            success.style.display = 'none';
            results.style.display = 'none';

            const formData = new FormData();
            formData.append('weather_file', file);

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                loading.style.display = 'none';

                if (data.error) {
                    showError(data.error);
                    return;
                }

                if (data.files) {
                    updateFileSelect(data.files, data.filename);
                }

                displayResults(data);
                fileInput.value = '';
                showSuccess('File uploaded successfully.');
            })
            .catch(err => {
                loading.style.display = 'none';
                showError('Error: ' + err.message);
            });
        }

        function deleteData() {
            const fileSelect = document.getElementById('fileSelect');
            const filename = fileSelect.value;
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const success = document.getElementById('success');
            const results = document.getElementById('results');

            if (!filename) {
                showError('Please select uploaded file first.');
                return;
            }

            loading.style.display = 'block';
            error.style.display = 'none';
            success.style.display = 'none';
            results.style.display = 'none';

            fetch('/api/delete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ filename: filename })
            })
            .then(response => response.json())
            .then(data => {
                loading.style.display = 'none';

                if (data.error) {
                    showError(data.error);
                    return;
                }

                if (data.files) {
                    updateFileSelect(data.files, '');
                }

                showSuccess(data.message || 'File deleted successfully.');
            })
            .catch(err => {
                loading.style.display = 'none';
                showError('Error: ' + err.message);
            });
        }

        function resetResults() {
            document.getElementById('fileSelect').value = '';
            document.getElementById('fileUpload').value = '';
            document.getElementById('results').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
        }
    </script>
</body>
</html>
